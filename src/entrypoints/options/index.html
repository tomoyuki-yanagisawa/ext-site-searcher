<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>検索サイトの設定 - Site Search</title>
    <!-- Chrome / Firefox の埋め込みダイアログではなく、タブで開く -->
    <meta name="manifest.open_in_tab" content="true" />
  </head>
  <body>
    <header>
      <h1>検索サイトの設定</h1>
      <p>右クリックメニューから検索するサイトを登録します。</p>
    </header>

    <main>
      <form id="site-form" novalidate inert>
        <fieldset>
          <legend>検索結果の開き方</legend>
          <label>
            <input type="radio" name="openIn" value="newTab" checked />
            新しいタブ（現在のタブの右隣）
          </label>
          <label>
            <input type="radio" name="openIn" value="currentTab" />
            現在のタブ
          </label>
        </fieldset>

        <fieldset>
          <legend>検索サイト</legend>
          <p><code>{query}</code> は選択した文字列に置き換わります。</p>

          <ol id="sites"></ol>

          <p id="empty">
            まだ検索サイトが登録されていません。「サイトを追加」から登録してください。
          </p>

          <button id="add" type="button">＋ サイトを追加</button>
        </fieldset>

        <footer>
          <p id="message" role="status" aria-live="polite"></p>
          <button type="submit">保存</button>
        </footer>
      </form>
    </main>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
