<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title data-i18n="optionsTitle">Search site settings - Site Search</title>
    <!-- Chrome / Firefox の埋め込みダイアログではなく、タブで開く -->
    <meta name="manifest.open_in_tab" content="true" />
  </head>
  <body>
    <header>
      <h1 data-i18n="heading">Search site settings</h1>
      <p data-i18n="intro">Add sites to search from the context menu.</p>
    </header>

    <main>
      <form id="site-form" novalidate inert>
        <fieldset>
          <legend data-i18n="openMode">Open search results in</legend>
          <label>
            <input type="radio" name="openIn" value="newTab" checked />
            <span data-i18n="newTab">A new tab to the right of the current tab</span>
          </label>
          <label>
            <input type="radio" name="openIn" value="currentTab" />
            <span data-i18n="currentTab">The current tab</span>
          </label>
          <label>
            <input type="radio" name="openIn" value="backgroundTab" />
            <span data-i18n="backgroundTab">A background tab to the right of the current tab</span>
          </label>
        </fieldset>

        <fieldset>
          <legend data-i18n="clipboard">Clipboard</legend>
          <label>
            <input id="copy-query" type="checkbox" />
            <span data-i18n="copyQuery">Copy the search text to the clipboard</span>
          </label>
          <p data-i18n="clipboardNotice">This replaces the current clipboard contents.</p>
        </fieldset>

        <fieldset>
          <legend data-i18n="sites">Search sites</legend>
          <p data-i18n="queryHelp">{query} is replaced with the selected text.</p>

          <ol id="sites"></ol>

          <template id="site-row">
            <li>
              <input type="text" name="name" placeholder="Google" aria-label="Name" data-i18n-label="name" />
              <input type="text" name="url" placeholder="https://www.google.com/search?q={query}" aria-label="Search URL" data-i18n-label="searchUrl" />
              <button type="button" data-action="move-up" aria-label="Move up" data-i18n-label="moveUp">↑</button>
              <button type="button" data-action="move-down" aria-label="Move down" data-i18n-label="moveDown">↓</button>
              <button type="button" data-action="delete" data-i18n="delete">Delete</button>
            </li>
          </template>

          <p id="empty" data-i18n="empty">No search sites yet. Use Add site to add one.</p>

          <button id="add" type="button" data-i18n="addSite">＋ Add site</button>
        </fieldset>

        <footer>
          <p id="message" role="status" aria-live="polite"></p>
          <button id="save" type="submit" data-i18n="save" disabled>Save</button>
        </footer>
      </form>
    </main>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
