<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>検索サイトの設定</title>
    <style>
      :root {
        color-scheme: light dark;
      }

      body {
        margin: 0;
        padding: 32px 24px;
        font-family: system-ui, sans-serif;
        font-size: 14px;
        line-height: 1.6;
      }

      main {
        max-width: 720px;
        margin: 0 auto;
      }

      h1 {
        margin: 0 0 24px;
        font-size: 20px;
      }

      #site-form {
        display: grid;
        gap: 12px;
      }

      .column-labels,
      .site-row {
        display: grid;
        grid-template-columns: minmax(120px, 1fr) minmax(240px, 3fr) auto;
        gap: 8px;
        align-items: center;
      }

      .column-labels {
        color: GrayText;
        font-size: 12px;
      }

      .site-row input {
        min-width: 0;
        padding: 6px 8px;
        font: inherit;
      }

      button {
        padding: 6px 12px;
        font: inherit;
        cursor: pointer;
      }

      .actions {
        display: flex;
        justify-content: space-between;
        gap: 8px;
        margin-top: 20px;
      }

      #message {
        min-height: 1.6em;
        margin: 16px 0 0;
      }

      #message.error {
        color: #c62828;
      }

      .hint {
        color: GrayText;
        font-size: 12px;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>検索サイトの設定</h1>
      <form id="site-form" novalidate>
        <div class="column-labels" aria-hidden="true">
          <span>名前</span>
          <span>検索URL</span>
          <span></span>
        </div>
        <div id="sites"></div>
        <div class="actions">
          <button id="add" type="button">追加</button>
          <button type="submit">保存</button>
        </div>
      </form>
      <p id="message" role="status" aria-live="polite"></p>
      <p class="hint">{query} は選択文字列に置き換わります。</p>
    </main>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
