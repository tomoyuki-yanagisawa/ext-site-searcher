name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event_name == 'pull_request' && github.run_id || github.ref }}
  queue: max

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    concurrency:
      group: ${{ github.workflow }}-test-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run zip
      - run: npm run zip:firefox

      - name: Upload Chrome zip
        uses: actions/upload-artifact@v7
        with:
          name: site-search-chrome-zip
          path: dist/*chrome*.zip
          if-no-files-found: error

      - name: Upload Firefox zip
        uses: actions/upload-artifact@v7
        with:
          name: site-search-firefox-zip
          path: dist/*firefox*.zip
          if-no-files-found: error

  version:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.check.outputs.version }}
      needed: ${{ steps.check.outputs.needed }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Check whether this version is already released
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: node .github/scripts/check-release.mjs

  release:
    needs: [test, version]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.version.outputs.needed == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Download zips
        uses: actions/download-artifact@v7
        with:
          pattern: site-search-*-zip
          path: zips
          merge-multiple: true

      - name: Prepare unsigned Firefox xpi
        run: |
          version="${{ needs.version.outputs.version }}"
          cp "zips/site-search-${version}-firefox.zip" "zips/site-search-${version}-firefox-unsigned.xpi"

      - name: Create GitHub release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ needs.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: v${{ needs.version.outputs.version }}
          files: |
            zips/*chrome*.zip
            zips/*firefox*.zip
            zips/*-firefox-unsigned.xpi
