name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site-search
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site-search/package-lock.json

      - run: npm ci
      - run: npm run typecheck

      - name: Build Chrome zip
        run: npm run zip

      - name: Build Firefox zip
        run: npm run zip:firefox

      - name: Upload Chrome artifact
        uses: actions/upload-artifact@v7
        with:
          name: site-search-chrome
          path: site-search/.output/*chrome*.zip
          if-no-files-found: error

      - name: Upload Firefox artifact
        uses: actions/upload-artifact@v7
        with:
          name: site-search-firefox
          path: site-search/.output/*firefox*.zip
          if-no-files-found: error

      - name: Attach zips to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: |
            site-search/.output/*chrome*.zip
            site-search/.output/*firefox*.zip
