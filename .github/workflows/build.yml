name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - run: npm ci
      - run: npm run typecheck
      - run: npm run zip
      - run: npm run zip:firefox

      - name: Upload Chrome zip
        uses: actions/upload-artifact@v7
        with:
          name: site-search-chrome-zip
          path: dist/*chrome*.zip
          if-no-files-found: error

      - name: Upload Firefox zip
        uses: actions/upload-artifact@v7
        with:
          name: site-search-firefox-zip
          path: dist/*firefox*.zip
          if-no-files-found: error

      - name: Upload Firefox build
        uses: actions/upload-artifact@v7
        with:
          name: site-search-firefox-build
          path: dist/firefox-mv3
          if-no-files-found: error

  version:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.check.outputs.version }}
      needed: ${{ steps.check.outputs.needed }}
    steps:
      - uses: actions/checkout@v7

      - name: Check whether this version is already released
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(node -p "require('./package.json').version")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if gh release view "v$version" >/dev/null 2>&1; then
            echo "needed=false" >> "$GITHUB_OUTPUT"
          else
            echo "needed=true" >> "$GITHUB_OUTPUT"
          fi

  release:
    needs: [test, version]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.version.outputs.needed == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - run: npm ci

      - name: Download Firefox build
        uses: actions/download-artifact@v7
        with:
          name: site-search-firefox-build
          path: dist/firefox-mv3

      - name: Download zips
        uses: actions/download-artifact@v7
        with:
          pattern: site-search-*-zip
          path: zips
          merge-multiple: true

      - name: Sign Firefox xpi
        env:
          WEB_EXT_API_KEY: ${{ secrets.AMO_JWT_ISSUER }}
          WEB_EXT_API_SECRET: ${{ secrets.AMO_JWT_SECRET }}
        run: npm run sign:firefox

      - name: Rename signed xpi
        run: |
          version="${{ needs.version.outputs.version }}"
          xpi=$(find dist/amo -maxdepth 1 -name '*.xpi' -print -quit)
          mv "$xpi" "dist/site-search-${version}-firefox-signed.xpi"

      - name: Upload signed xpi
        uses: actions/upload-artifact@v7
        with:
          name: site-search-firefox-signed
          path: dist/*-firefox-signed.xpi
          if-no-files-found: error

      - name: Create GitHub release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ needs.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: v${{ needs.version.outputs.version }}
          files: |
            zips/*chrome*.zip
            zips/*firefox*.zip
            dist/*-firefox-signed.xpi
