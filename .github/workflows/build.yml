name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - run: npm ci
      - run: npm run typecheck

      - name: Build Chrome zip
        run: npm run zip

      - name: Build Firefox zip
        run: npm run zip:firefox

      - name: Sign Firefox xpi
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          WEB_EXT_API_KEY: ${{ secrets.AMO_JWT_ISSUER }}
          WEB_EXT_API_SECRET: ${{ secrets.AMO_JWT_SECRET }}
        run: npm run sign:firefox

      - name: Rename signed xpi
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version=$(node -p "require('./package.json').version")
          xpi=$(find dist/amo -maxdepth 1 -name '*.xpi' -print -quit)
          mv "$xpi" "dist/site-search-${version}-firefox-signed.xpi"

      - name: Upload Chrome artifact
        uses: actions/upload-artifact@v7
        with:
          name: site-search-chrome
          path: dist/*chrome*.zip
          if-no-files-found: error

      - name: Upload Firefox artifact
        uses: actions/upload-artifact@v7
        with:
          name: site-search-firefox
          path: dist/*firefox*.zip
          if-no-files-found: error

      - name: Upload signed Firefox artifact
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v7
        with:
          name: site-search-firefox-signed
          path: dist/*-firefox-signed.xpi
          if-no-files-found: error

      - name: Attach files to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: |
            dist/*chrome*.zip
            dist/*firefox*.zip
            dist/*-firefox-signed.xpi
